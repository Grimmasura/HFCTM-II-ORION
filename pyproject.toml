[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mih-iie"
version = "2.0.0"
description = "Majorana–Ironwood Hybrid Intrinsic Inference Engine"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "MIH-IIE Team" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "numpy>=1.21.0",
  "uvicorn>=0.18.0",
  "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx==0.27.0",
  "pytest-cov>=4.0.0",
  "GitPython>=3.1.0",
  "requests>=2.31.0",
]
ml = [
  "torch>=2.0.0",
  "qiskit>=0.39.0",
  "cirq>=1.0.0",
  "jax>=0.4.0",
  "PyWavelets>=1.4.0",
  "scikit-learn>=1.0.0",
]
metrics = [
  "prometheus-client>=0.16.0",
]

[tool.setuptools]
packages = { find = { exclude = ["tests", "tests.*", "legacy_orion", "legacy_orion.*"] } }
