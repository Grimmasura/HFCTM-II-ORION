[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    v2: marks tests for MIH-IIE v2.0 features
    requires_torch: marks tests that require PyTorch
    requires_ml: marks tests that require ML dependencies

# Default: skip slow tests in CI
addopts = -m "not slow"
