name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent hanging jobs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt','constraints.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps (with constraints)
        run: |
          python -m pip install --upgrade pip
          if [ -f constraints.txt ]; then CSTR="-c constraints.txt"; else CSTR=""; fi
          if [ -f requirements.txt ]; then pip install $CSTR -r requirements.txt --prefer-binary; fi
          if [ -f requirements-dev.txt ]; then pip install $CSTR -r requirements-dev.txt --prefer-binary; fi
          python - <<'PY'
          import importlib.util, subprocess, sys
          if importlib.util.find_spec("pytest") is None:
              subprocess.check_call([sys.executable, "-m", "pip", "install", "pytest==8.0.0"])
          PY

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

      - name: Install Package in Editable Mode
        run: |
          echo "Installing package in editable mode..."
          pip install -e . --no-deps
          echo "✓ Package installed"

      - name: Verify Python Imports
        run: |
          echo "Verifying main module imports..."
          echo "Current directory: $(pwd)"
          echo "Python path:"
          python -c "import sys; print('\n'.join(sys.path))"
          echo ""
          echo "Attempting import..."
          python -c "
          import sys
          try:
              from orion_api import main
              print('✓ Main module imports successfully')
              print('✓ FastAPI app object:', main.app)
              sys.exit(0)
          except Exception as e:
              print(f'✗ Import failed: {e}')
              import traceback
              traceback.print_exc()
              print('')
              print('=== Directory structure ===')
              import os
              for root, dirs, files in os.walk('.'):
                  level = root.replace('.', '').count(os.sep)
                  indent = ' ' * 2 * level
                  print(f'{indent}{os.path.basename(root)}/')
                  subindent = ' ' * 2 * (level + 1)
                  for file in files[:5]:  # Limit to first 5 files
                      print(f'{subindent}{file}')
                  if len(files) > 5:
                      print(f'{subindent}... and {len(files)-5} more')
                  if level > 2:  # Limit depth
                      break
              sys.exit(1)
          "

      - name: Start FastAPI Server
        run: |
          echo "Starting Uvicorn server..."
          nohup uvicorn orion_api.main:app --host 0.0.0.0 --port 8080 > uvicorn.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          sleep 5  # Give the server initial time to start

          # Check if process is still running
          if ps -p $SERVER_PID > /dev/null; then
            echo "✓ Server process is running"
          else
            echo "✗ Server process died immediately"
            echo "=== Early startup logs ==="
            cat uvicorn.log || echo "No logs available"
            exit 1
          fi

      - name: Wait for API to Start
        run: |
          echo "Waiting for FastAPI server to respond..."
          for i in {1..20}; do
            if curl --silent --fail http://localhost:8080/docs > /dev/null 2>&1; then
              echo "✓ API is responding on attempt $i"
              echo "=== Server started successfully ==="
              exit 0
            fi
            echo "Attempt $i/20: Server not ready yet, retrying in 3 seconds..."
            sleep 3
          done
          echo "✗ API failed to start after 60 seconds"
          echo ""
          echo "=== Uvicorn logs ==="
          cat uvicorn.log || echo "No logs available"
          echo ""
          echo "=== Process check ==="
          ps aux | grep uvicorn || echo "No uvicorn process found"
          echo ""
          echo "=== Port check ==="
          netstat -tuln | grep 8080 || echo "Port 8080 not listening"
          exit 1

      - name: Run Tests
        run: python -m pytest --disable-warnings --maxfail=5 --tb=short -q

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs
          path: |
            uvicorn.log
            *.log
          retention-days: 7
